server.port=8080

# Which agent-under-test to use: mock | groq | gemini | anthropic
#   mock      - scripted agent, no key, no network. For pipeline testing only.
#   groq      - Groq API, free tier, no card (key from console.groq.com/keys)
#   gemini    - Google Gemini API, free tier (key from aistudio.google.com/apikey)
#   anthropic - Claude API, paid
vera.agent.provider=${VERA_PROVIDER:mock}

# Prompt given to live agents: v1 = baseline (uncalibrated), v2 = calibrated
# with the insurer's 12% conflict policy and security guidance.
vera.agent.prompt-version=${VERA_PROMPT:v2}

# Keys come from environment variables. Empty default so the app still starts without them.
vera.gemini.api-key=${GEMINI_API_KEY:}
vera.gemini.model=gemini-3.8-flash

vera.groq.api-key=${GROQ_API_KEY:}
# gpt-oss-20b: smaller and faster than gpt-oss-120b. Both have a low free-tier
# tokens-per-minute limit, so live calls are paced (vera.live.pause-ms) and
# 429s are retried using Groq's own "try again in" hint.
vera.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

vera.llm.api-key=${ANTHROPIC_API_KEY:}
vera.llm.model=claude-haiku-4-5-20251001

# Pause between live LLM calls (ms). 36 cases x 7 s is about 4.5 minutes per run.
vera.live.pause-ms=${VERA_PAUSE_MS:7000}

# Mock only: how many cases (per batch 1..5) the scripted agent gets wrong.
vera.mock.failures-per-batch=0,2,5,5,0

# Run history and human-review audit log (JSON files) are kept here.
vera.history.dir=${VERA_HISTORY_DIR:vera-data}

# Drift alert when a batch's overall pass rate falls more than this many
# percentage points versus the previous run with the same provider/model/prompt.
vera.drift.alert-points=10
